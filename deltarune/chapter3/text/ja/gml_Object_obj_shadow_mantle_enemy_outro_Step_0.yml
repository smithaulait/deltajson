  なまくらになる。/
"obj_shadow_mantle_enemy_outro_slash_Step_0_gml_25_0": |-
  ハハハ^1…
  さて^1　おたがい　仕事が残っている。/%
"obj_shadow_mantle_enemy_outro_slash_Step_0_gml_42_0": |-
  このマントが欲しければ^1　
  早く拾うこと。/%
"obj_shadow_mantle_enemy_outro_slash_Step_0_gml_60_0": |-
  …手が　届けば！/%

"obj_b2_moneyhole_slash_Step_0_gml_23_0": |-
  待った！！それは
  “ワタシの”
  ボーナスゾーンだ！
"obj_b2_moneyhole_slash_Step_0_gml_30_0": |-
  オレが見つけたから
  オレのだな
"obj_b2_moneyhole_slash_Step_0_gml_43_0": |-
  ハッハッハ！
  手が届きませんね！
"obj_b2_moneyhole_slash_Step_0_gml_52_0": |-
  背が低いドロボウ対策です！
"obj_b2_moneyhole_slash_Step_0_gml_57_0": |-
  んー…
"obj_b2_moneyhole_slash_Step_0_gml_64_0": |-
  ねえ スージィ
  もう行こう？
"obj_b2_moneyhole_slash_Step_0_gml_71_0": |-
  …え！
"obj_b2_moneyhole_slash_Step_0_gml_114_0": |-
  わー！！
  き…汚いおカネまみれに
  なっちゃったよー！！
"obj_b2_moneyhole_slash_Step_0_gml_122_0": |-
  デジタル通貨は安全だって
  “アイツ”が言ってたのに！！
"obj_b2_moneyhole_slash_Step_0_gml_141_0": |-
  …ボーナスゾーンの１つも
  安心して持てないなんて…
  トホホ…
"obj_b2_moneyhole_slash_Step_0_gml_174_0": |-
  そうだね クリス
  あのボーナスゾーンは
  ボクたちのじゃ
  ないもんね
"obj_b2_moneyhole_slash_Step_0_gml_180_0": |-
  そのとーり！！
  正直者が
  報われる！
"obj_b2_moneyhole_slash_Step_0_gml_185_0": |-
  はい！ごほうびの
  １ポイント！！
"obj_b2_moneyhole_slash_Step_0_gml_197_0": |-
  ちょっ！ワタシのゾーンには
  触らないんじゃなかったの！？

"obj_ch4_PDC03_catty_preach_slash_Create_0_gml_10_0": |-
  きゃ～ヤバ～い！　てか　ウチらを
  みまもってる　てんしさま？　とかが～
"obj_ch4_PDC03_catty_preach_slash_Create_0_gml_11_0": |-
  なんか　じくう？　とかが　かたる？
  めっちゃヤバい　よげんを　しってて～
"obj_ch4_PDC03_catty_preach_slash_Create_0_gml_12_0": |-
  そんでそんで～
  え～～～～っとぉ～…
"obj_ch4_PDC03_catty_preach_slash_Create_0_gml_13_0": |-
  あ　そうそう　おもいだした！
  わかりやすく　いうと～…
"obj_ch4_PDC03_catty_preach_slash_Create_0_gml_14_0": |-
  ゆうしゃの　ひとたちが　いて～
  そのひとたちが　めっちゃヤバくて～
"obj_ch4_PDC03_catty_preach_slash_Create_0_gml_15_0": |-
  つるぎ？　とか　もってて？
"obj_ch4_PDC03_catty_preach_slash_Create_0_gml_16_0": |-
  あと　ツノ？　とか
  はえてるコも　いて？
"obj_ch4_PDC03_catty_preach_slash_Create_0_gml_17_0": |-
  そのコが　チョ～かわいくて～
"obj_ch4_PDC03_catty_preach_slash_Create_0_gml_18_0": |-
  てか　しゃしんとか
  ないんだけど…
"obj_ch4_PDC03_catty_preach_slash_Create_0_gml_19_0": |-
  たぶん　かわいいとおもう！
  わかんないけど！
"obj_ch4_PDC03_catty_preach_slash_Create_0_gml_20_0": |-
  ほっぺ　プニプニ～！
  パンプキンパイ　あげちゃう～！
"obj_ch4_PDC03_catty_preach_slash_Create_0_gml_21_0": |-
  ローカロリーキャットフードの
  クーポンも　あげちゃう～！
"obj_ch4_PDC03_catty_preach_slash_Create_0_gml_22_0": |-
  てか　クーポンたまりすぎて
  マジこまるから　もらって～！
"obj_ch4_PDC03_catty_preach_slash_Create_0_gml_23_0": |-
  でもでも～　なにが　スゴいってね？
  その　ゆうしゃの　ひとたちってね…
"obj_ch4_PDC03_catty_preach_slash_Create_0_gml_24_0": |-
  わ～　いってて　ドキドキしてきた！
  フゥ…　そのひとたちって～…
"obj_ch4_PDC03_catty_preach_slash_Create_0_gml_25_0": |-
  ウチらのなかの　だれかって
  かのうせいも　あるわけ～！
"obj_ch4_PDC03_catty_preach_slash_Create_0_gml_26_0": |-
  それって　めっちゃ
  だいじなことで～
"obj_ch4_PDC03_catty_preach_slash_Create_0_gml_27_0": |-
  だってだって
  ウチら　み～んな…
"obj_ch4_PDC03_catty_preach_slash_Create_0_gml_28_0": |-
  せかいを　かえちゃうかも
  しんない　ひとなわけじゃん？
"obj_ch4_PDC03_catty_preach_slash_Create_0_gml_29_0": |-
  だから～　みんな　おたがいに
  やさしく　しましょ～ね～ってことで～
"obj_ch4_PDC03_catty_preach_slash_Create_0_gml_30_0": |-
  それが　この　きょうかいの　おしえの
  いちばん　だいじな　とこで～
"obj_ch4_PDC03_catty_preach_slash_Create_0_gml_31_0": |-
  みんなに　やさしく！
  みんな　ファミリー！
"obj_ch4_PDC03_catty_preach_slash_Create_0_gml_32_0": |-
  それが　だれでも！
  どんな　ひとでも！
"obj_ch4_PDC03_catty_preach_slash_Create_0_gml_33_0": |-
  ウチらって～　ヘンなモノ　しんじてるけど～
  みんなに　やさしいよね！
"obj_ch4_PDC03_catty_preach_slash_Create_0_gml_34_0": |-
  だって　だれが　ゆうしゃになるか
  わかんないじゃん？
"obj_ch4_PDC03_catty_preach_slash_Create_0_gml_35_0": |-
  てか…ひょっとしたら
  アタシかもじゃん？
"obj_ch4_PDC03_catty_preach_slash_Create_0_gml_36_0": |-
  みんなに　かくしてる
  ヒミツとか　あるかもじゃん…？
"obj_ch4_PDC03_catty_preach_slash_Create_0_gml_37_0": |-
  って　ウッソで～す！
  アタシは　ちがいま～す！　アハハハハ！
"obj_ch4_PDC03_catty_preach_slash_Create_0_gml_38_0": |-
  …とか　いって　じつは…？
  ホント…？　かも…？？　な～んて！
"obj_ch4_PDC03_catty_preach_slash_Create_0_gml_39_0": |-
  あ　でもでも～
  それだけじゃなくて～
"obj_ch4_PDC03_catty_preach_slash_Create_0_gml_40_0": |-
  その　よげんに　よると～
  ガチにヤバいことも　おきるかもで？
"obj_ch4_PDC03_catty_preach_slash_Create_0_gml_41_0": |-
  えっとね　えっとね…　なんだっけ…
  「やくさい」？
"obj_ch4_PDC03_catty_preach_slash_Create_0_gml_42_0": |-
  でも　だいじょうぶ～！
  だってね　だってね…
"obj_ch4_PDC03_catty_preach_slash_Create_0_gml_43_0": |-
  …
"obj_ch4_PDC03_catty_preach_slash_Create_0_gml_44_0": |-
  ゴメン　わすれちゃった～！
"obj_ch4_PDC03_catty_preach_slash_Create_0_gml_45_0": |-
  いっつも　ろうどくの　とちゅうで
  ねちゃうから～！　ウケる～！！
"obj_ch4_PDC03_catty_preach_slash_Create_0_gml_46_0": |-
  あ　そだそだ！　ついでに
  みんなに　あいさつしていい？
"obj_ch4_PDC03_catty_preach_slash_Create_0_gml_47_0": |-
  えっと　まず～…　いつも
  おうえんしてくれる　ママとパパ！
"obj_ch4_PDC03_catty_preach_slash_Create_0_gml_48_0": |-
  ママ～！　パパ～！　みてる～！？
"obj_ch4_PDC03_catty_preach_slash_Create_0_gml_49_0": |-
  あとは～　ウチの　いもうと！
"obj_ch4_PDC03_catty_preach_slash_Create_0_gml_50_0": |-
  きょうは　きてないけど～
"obj_ch4_PDC03_catty_preach_slash_Create_0_gml_51_0": |-
  いま　なにしてんのか　しらないけど～
  アクマと　おしゃべりとか　かな？
"obj_ch4_PDC03_catty_preach_slash_Create_0_gml_52_0": |-
  ウチの　いもうとって～　アクマ　よびだすの～
  かわいくない？　ウケる～！
"obj_ch4_PDC03_catty_preach_slash_Create_0_gml_53_0": |-
  いもうとも　くればいいのにね～
"obj_ch4_PDC03_catty_preach_slash_Create_0_gml_54_0": |-
  せいなる　ひかりとか
  あびまくれば　いいのに～
"obj_ch4_PDC03_catty_preach_slash_Create_0_gml_55_0": |-
  そんで　ネコようの　せいなるボウルに
  はいった　みずを　ペロペロして～…
"obj_ch4_PDC03_catty_preach_slash_Create_0_gml_56_0": |-
  え？　あの　みずって
  のんじゃ　ダメなの？
"obj_ch4_PDC03_catty_preach_slash_Create_0_gml_57_0": |-
  ヤダ～　アタシ　のみまくってた～！
  ノドかわいてたから～！　ウケる～！！
"obj_ch4_PDC03_catty_preach_slash_Create_0_gml_58_0": |-
  ヤダ～！！　きゃはははは！！
"obj_ch4_PDC03_catty_preach_slash_Create_0_gml_59_0": |-
  きゃはははは！！
"obj_ch4_PDC03_catty_preach_slash_Create_0_gml_61_0": |-
  え？　ろうどく　おわり？
  え～～～～

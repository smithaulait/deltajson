"obj_dw_church_worshiproom_slash_Step_0_gml_33_0": |-
  ＊ 静かに！/
"obj_dw_church_worshiproom_slash_Step_0_gml_34_0": |-
  ＊ これは　われわれの
  　 聖なる先祖の像だ。/
"obj_dw_church_worshiproom_slash_Step_0_gml_35_0": |-
  ＊ もしも出会うことが
  　 できたなら…/
"obj_dw_church_worshiproom_slash_Step_0_gml_36_0": |-
  ＊ 心安らぐ　すばらしい説法を
  　 聞かせてもらえただろうに。/%
"obj_dw_church_worshiproom_slash_Step_0_gml_41_0": |-
  ＊ われらの聖なる　ご先祖さま！/%
"obj_dw_church_worshiproom_slash_Step_0_gml_47_0": |-
  ＊ 像は　威厳に満ちている。/%
"obj_dw_church_worshiproom_slash_Step_0_gml_55_0": |-
  ＊ われらの　偉大なるご先祖さまは
  　 どこへ行った！？/
"obj_dw_church_worshiproom_slash_Step_0_gml_56_0": |-
  ＊ この　たわ言ばかり　わめく
  　 しれ者が　なにか　したに
  　 ちがいない…！/%
"obj_dw_church_worshiproom_slash_Step_0_gml_61_0": |-
  ＊ ああ^1　なんという悲劇…
  　 われらの　偉大なるご先祖さまの像が
  　 消えてしまった！/
"obj_dw_church_worshiproom_slash_Step_0_gml_62_0": |-
  ＊ 不敬な罪を犯した者は^1　
  　 相応の罰を受けるべきだ！/%
"obj_dw_church_worshiproom_slash_Step_0_gml_68_0": |-
  ＊ 立ち去れ！/%
"obj_dw_church_worshiproom_slash_Step_0_gml_89_0": |-
  ＊ (なんらかの像だ)/%
"obj_dw_church_worshiproom_slash_Step_0_gml_96_0": |-
  ＊ なにを　している？/
"obj_dw_church_worshiproom_slash_Step_0_gml_97_0": |-
  ＊ ワレは　ワレらの先祖の像を
  　 守っている！/
"obj_dw_church_worshiproom_slash_Step_0_gml_98_0": |-
  ＊ もしも　先祖に出会うことが
  　 できたなら…/
"obj_dw_church_worshiproom_slash_Step_0_gml_99_0": |-
  ＊ きっと　彼らは
  　 すばらしかっただろう…/
"obj_dw_church_worshiproom_slash_Step_0_gml_100_0": |-
  ＊ …すぐに暴力を振るおうとする
  　 乱暴者たちとは　ちがって。/%
"obj_dw_church_worshiproom_slash_Step_0_gml_105_0": |-
  ＊ ここに集う乱暴者たちも^1　
  　 先祖孝行の　大切さを
  　 学ぶべきだ！/%
"obj_dw_church_worshiproom_slash_Step_0_gml_113_0": |-
  ＊ 言葉を話す　考古学的遺物^1！
  　 …おとなしい石のほうが
  　 崇拝しやすかった。/
"obj_dw_church_worshiproom_slash_Step_0_gml_114_0": |-
  ＊ とはいえ^1　ワレワレの祖先が
  　 ワレを　ブッ飛ばしたいのなら^1　
  　 ただ　そうさせるのみ。/%
"obj_dw_church_worshiproom_slash_Step_0_gml_118_0": |-
  ＊ 彼らは　ドングリが　なにか
  　 知っているという^1。
  　 それは　ゆゆしきことだ。/
"obj_dw_church_worshiproom_slash_Step_0_gml_119_0": |-
  ＊ 知っていては^1　それは　なにか
  　 たずねることができない！/%

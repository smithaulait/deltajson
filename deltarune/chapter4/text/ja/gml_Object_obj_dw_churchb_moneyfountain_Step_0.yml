"obj_dw_churchb_moneyfountain_slash_Step_0_gml_77_0": |-
  ＊ 。う言をのも
  　 が\cA額の付寄　のでここ
  　 きとたっ渡へ側対反\cW/%
"obj_dw_churchb_moneyfountain_slash_Step_0_gml_103_0": |-
  ＊ (水が　光を放っている^1…
  　 中で　黄金のコインが
  　 キラキラと輝いている)/%
"obj_dw_churchb_moneyfountain_slash_Step_0_gml_108_0": |-
  ＊ (水は　むなしく凍りついている)/%
"obj_dw_churchb_moneyfountain_slash_Step_0_gml_138_0": |-
  ＊ キミは　寄付者だ。
  　 キミが寄付した「カネ」は
  　 「金」に変化した。/
"obj_dw_churchb_moneyfountain_slash_Step_0_gml_139_0": |-
  ＊ 総額^1　\cY~1G\cWに　到達した。/
"obj_dw_churchb_moneyfountain_slash_Step_0_gml_144_0": |-
  ＊ キミは　寄付者の１人だ。/
"obj_dw_churchb_moneyfountain_slash_Step_0_gml_145_0": |-
  ＊ キミと　もう１人の寄付者で^1　
  　 総額\cY~1G\cWに　到達した。/
"obj_dw_churchb_moneyfountain_slash_Step_0_gml_150_0": |-
  ＊ いかに　小さな行いでも
  　 それが　他者の行動を促す
  　 可能性がある。/
"obj_dw_churchb_moneyfountain_slash_Step_0_gml_154_0": |-
  ＊ 真っ赤になるほど　恥ずかしかった
  　 かもしれないが^1　
  　 まちがいなく正しい行いだった。/
"obj_dw_churchb_moneyfountain_slash_Step_0_gml_158_0": |-
  ＊ しかも　君が寄付した硬貨には
  　 ミントコンディションのものが
  　 含まれていた。/
"obj_dw_churchb_moneyfountain_slash_Step_0_gml_162_0": |-
  ＊ 君の気前のよさに　まちがいなく
  　 天も涙した。/
"obj_dw_churchb_moneyfountain_slash_Step_0_gml_166_0": |-
  ＊ なんと　愚かな…/
"obj_dw_churchb_moneyfountain_slash_Step_0_gml_167_0": |-
  ＊ そのカネは　クモにでも
  　 やったほうが　ましだっただろう。/
"obj_dw_churchb_moneyfountain_slash_Step_0_gml_170_0": "＊ その宝箱の中にあるものを^1 \n　 まるで　自分のものかのように\n\
  　 持っていくといい。/%"
